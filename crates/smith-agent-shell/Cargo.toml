[package]
license.workspace = true
name = "smith-agent-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
smith-protocol-program.workspace = true
skein-lib.workspace = true
skein-io.workspace = true
skein-shell.workspace = true
skein-channel.workspace = true
skein-http.workspace = true
skein-llm.workspace = true
skein-llm-connection.workspace = true
skein-tls.workspace = true
smith-domain.workspace = true
smith-events.workspace = true
smith-agent-service.workspace = true
smith-protocol-channel.workspace = true
smith-protocol-llm.workspace = true
smith-protocol-machine.workspace = true
smith-channel.workspace = true
smith-charter.workspace = true
smith-transcript.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
skein-scratch.workspace = true
skein-world.workspace = true

[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
dbg_macro = "deny"
missing_assert_message = "deny"
iter_over_hash_type = "deny"
